name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch Android Files (Full Screen & Queries)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          STYLES="android/app/src/main/res/values/styles.xml"
          
          # 1. Thêm quyền mở app khác & Làm Launcher (Màn hình chính)
          sed -i 's|</manifest>|    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n        </intent>\n    </queries>\n</manifest>|' $MANIFEST
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n            <category android:name="android.intent.category.HOME" />\n            <category android:name="android.intent.category.DEFAULT" />|' $MANIFEST
          
          # 2. Ép ẩn thanh trạng thái (Full màn hình) thông qua file styles.xml
          sed -i 's|<item name="android:windowFullscreen">false</item>|<item name="android:windowFullscreen">true</item>|g' $STYLES
          sed -i 's|</style>|    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n</style>|' $STYLES

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terminal-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
