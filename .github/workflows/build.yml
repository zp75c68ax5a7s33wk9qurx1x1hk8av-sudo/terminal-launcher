name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch Android Files (Full Screen & Queries)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          MAIN_ACTIVITY="android/app/src/main/java/com/terminal/launcher/MainActivity.java"
          
          # 1. Thêm quyền mở app khác & Làm Launcher
          sed -i 's|</manifest>|    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n        </intent>\n    </queries>\n</manifest>|' $MANIFEST
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n            <category android:name="android.intent.category.HOME" />\n            <category android:name="android.intent.category.DEFAULT" />|' $MANIFEST
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          
          # 2. Viết code Java ép ẩn thanh trạng thái (Immersive Mode)
          sed -i '/public class MainActivity extends BridgeActivity {/a\
            @Override\
            public void onCreate(Bundle savedInstanceState) {\
                super.onCreate(savedInstanceState);\
                getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);\
                getWindow().getDecorView().setSystemUiVisibility(\
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |\
                    View.SYSTEM_UI_FLAG_FULLSCREEN |\
                    View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |\
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE |\
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |\
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\
                );\
            }' $MAIN_ACTIVITY
          
          sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.WindowManager;|' $MAIN_ACTIVITY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terminal-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
