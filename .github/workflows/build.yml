name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch Android Files (Manifest & Full Screen)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          MAIN_ACTIVITY="android/app/src/main/java/com/terminal/launcher/MainActivity.java"
          
          # 1. Cấu hình Manifest: Thêm quyền mở app khác & Làm Launcher (Màn hình chính)
          sed -i 's|</manifest>|    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n        </intent>\n    </queries>\n</manifest>|' $MANIFEST
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n            <category android:name="android.intent.category.HOME" />\n            <category android:name="android.intent.category.DEFAULT" />|' $MANIFEST
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          
          # 2. Ép giao diện sang chế độ Toàn màn hình (Ẩn thanh pin, giờ, thông báo)
          sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN, android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);\n        getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY \| android.view.View.SYSTEM_UI_FLAG_FULLSCREEN \| android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION \| android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE \| android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN \| android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);|' $MAIN_ACTIVITY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: terminal-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
