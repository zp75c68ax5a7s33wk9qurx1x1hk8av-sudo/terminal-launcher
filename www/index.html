<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
.enter{animation:fade .6s ease-out backwards,slide .9s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes fade{from{opacity:0;filter:blur(10px)}}
@keyframes slide{from{transform:translateX(-70px)}}
.pulse{animation:pulse .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.launch{animation:launch .28s ease-in forwards}
@keyframes launch{0%{transform:none;opacity:1;filter:blur(0)}35%{transform:translateX(-14px) scale(.95)}100%{transform:translateX(50px) scale(1.05);opacity:0;filter:blur(6px)}}
.leave{animation:leave .3s ease-in forwards}
@keyframes leave{to{opacity:0;filter:blur(8px);transform:translateX(90px)}}
.bgin{animation:bgfade .8s ease-out backwards,bgzoom 1.1s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes bgfade{from{opacity:0}}
@keyframes bgzoom{from{transform:scale(1.15)}}
.bgout{animation:bgclear .5s ease-in forwards}
@keyframes bgclear{to{opacity:0;transform:scale(1.15)}}
#list div,#promptLine,#row,#arrow,#out{transform-origin:left center}
#list div{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#list div:active{transform:scale(.93);transition-duration:.12s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<body onclick="q.focus()" style="margin:0;height:100vh;height:100dvh;background:#000;color:#4af;font:18px 'Courier New',monospace;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;overflow:hidden;touch-action:pan-y">
<div id=bg style="position:fixed;inset:-20px;z-index:-1;background:center/cover;transition:filter .6s ease"></div>
<input id=f type=file accept=image/* hidden>
<div id=out style="white-space:pre-wrap;color:#fff;margin-bottom:8px"></div>
<div id=list style="overflow:auto;margin-bottom:16px"></div>
<div id=promptLine>root:linux:~$</div>
<div id=row style=display:flex>
<span id=arrow>&gt;&nbsp;</span>
<input id=q autofocus autocomplete=off autocapitalize=off spellcheck=false style="flex:1;min-width:0;font:inherit;background:transparent;color:#fff;border:0;outline:0;padding:0;caret-color:#fff">
</div>
<script>
const DEFAULT_COLORS={prompt:"#4af",app:"#fff",text:"#fff"};
let wallpaper="",blur=4,dim=0.3,apps=[],colors={...DEFAULT_COLORS};

if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
  window.Capacitor.Plugins.StatusBar.hide();
  window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true });
}

try{
wallpaper=localStorage.w||"";
blur=localStorage.b?+localStorage.b:blur;
dim=localStorage.d?+localStorage.d:dim;
apps=JSON.parse(localStorage.a||"[]");
if(!Array.isArray(apps))apps=Object.entries(apps).map(([name,target])=>({name,target}));
colors={...colors,...JSON.parse(localStorage.c||"{}")};
}catch(e){apps=[]}
colors.app=DEFAULT_COLORS.app;
const HELP=[
"add <tên> <package|link> thêm app",
"rm <tên|số> xóa app",
"mv <tên|số> <vị trí> di chuyển app",
"color <tên|số> <mã màu> đổi màu 1 app",
"color all <mã màu> đổi màu mọi app",
"color <prompt|text> <mã màu> đổi màu giao diện",
"color reset màu mặc định",
"wallpaper --set đổi hình nền",
"wallpaper --remove xóa hình nền",
"wallpaper --blur <0-40> độ mờ hình nền",
"wallpaper --dim <0-100> độ tối hình nền",
"help xem lệnh"
].join("\n");
const save=(key,value)=>{
try{localStorage[key]=value}catch(e){}
};
const saveApps=()=>save("a",JSON.stringify(apps));
const saveColors=()=>save("c",JSON.stringify(colors));
const play=(element,name,delay=0)=>{
if(!element)return;
element.classList.remove("enter","pulse","launch","leave","bgin","bgout");
element.style.animationDelay=delay+"ms";
void element.offsetWidth;
element.classList.add(name);
};
const say=text=>{
out.textContent=text;
if(text)play(out,"enter");
};
const isValidColor=value=>CSS.supports("color",value);
const normalizeColor=value=>/^[0-9a-f]{3}$|^[0-9a-f]{6}$/i.test(value)?"#"+value:value;

const openTarget=async target=>{
  try {
    if(/^https?:/.test(target)){
      window.open(target, "_system");
    } else {
      if (window.AndroidBridge && window.AndroidBridge.openApp) {
        window.AndroidBridge.openApp(target);
      } else {
        window.location.href = "intent://#Intent;package=" + target + ";end";
      }
    }
  } catch (e) {
    console.error(e);
  }
};

const launch=(target,element)=>{
play(element,"launch");
setTimeout(()=>{
openTarget(target);
element.classList.remove("launch");
element.style.animationDelay="0ms";
},280);
};
const findIndex=key=>{
if(/^\d+$/.test(key))return +key-1;
return apps.findIndex(app=>app.name==key.toLowerCase());
};
const pulseApp=(index,delay=0)=>play(list.children[index],"pulse",delay);
const renderColors=()=>{
document.body.style.color=colors.prompt;
out.style.color=colors.text;
q.style.color=colors.text;
q.style.caretColor=colors.text;
[...list.children].forEach((item,index)=>{
item.style.color=(apps[index]||{}).color||colors.app;
});
};
const renderWallpaper=()=>{
const shade="linear-gradient(rgba(0,0,0,"+dim+"),rgba(0,0,0,"+dim+"))";
bg.style.backgroundImage=wallpaper?shade+",url("+wallpaper+")":"none";
bg.style.filter="blur("+blur+"px)";
};
const removeWallpaper=()=>{
if(!wallpaper)return say("Chưa có hình nền");
wallpaper="";
try{localStorage.removeItem("w")}catch(e){}
play(bg,"bgout");
setTimeout(()=>{
bg.classList.remove("bgout");
renderWallpaper();
},500);
};
const renderApps=only=>{
list.replaceChildren(...apps.map((app,index)=>{
const item=document.createElement("div");
item.textContent=(index+1)+". "+app.name;
item.style.padding="8px 0";
if(only===undefined||only===index){
item.classList.add("enter");
item.style.animationDelay=(only===undefined?index*70:0)+"ms";
}
item.onclick=e=>{
e.stopPropagation();
launch(app.target,item);
};
return item;
}));
renderColors();
};

f.onchange=()=>{
const reader=new FileReader;
reader.onload=()=>{
const img = new Image();
img.onload = () => {
  const canvas = document.createElement('canvas');
  const MAX_WIDTH = 1080;
  const scale = Math.min(MAX_WIDTH / img.width, 1);
  canvas.width = img.width * scale;
  canvas.height = img.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  wallpaper = canvas.toDataURL('image/jpeg', 0.7);
  save("w",wallpaper);
  renderWallpaper();
  play(bg,"bgin");
};
img.src = reader.result;
};
if(f.files[0])reader.readAsDataURL(f.files[0]);
f.value="";
};

const runColor=args=>{
if(args[1]=="reset"&&args.length==2){
colors={...DEFAULT_COLORS};
apps.forEach(app=>{delete app.color});
saveColors();
saveApps();
renderColors();
apps.forEach((app,index)=>pulseApp(index,index*50));
play(promptLine,"pulse");
play(arrow,"pulse");
play(out,"pulse");
return;
}
if(args.length<3)return say("color <tên|số|all|prompt|text> <mã màu>");
const key=args[1].toLowerCase();
const value=normalizeColor(args.slice(2).join(" "));
if(!isValidColor(value))return say("Màu không hợp lệ: "+args.slice(2).join(" "));
if(key=="prompt"){
colors.prompt=value;
saveColors();
renderColors();
play(promptLine,"pulse");
play(arrow,"pulse");
}else if(key=="text"){
colors.text=value;
saveColors();
renderColors();
play(out,"pulse");
play(row,"pulse");
}else if(key=="all"){
apps.forEach(app=>{app.color=value});
saveApps();
renderColors();
apps.forEach((app,index)=>pulseApp(index,index*50));
}else{
const index=findIndex(key);
if(!apps[index])return say("Không tìm thấy: "+args[1]);
apps[index].color=value;
saveApps();
renderColors();
pulseApp(index);
}
};
const run=v=>{
const args=v.split(/\s+/);
const cmd=args[0].toLowerCase();
if(cmd=="help"){
say(HELP);
}else if(cmd=="add"&&args.length==3){
const name=args[1].toLowerCase();
const index=findIndex(name);
if(index>=0)apps[index].target=args[2];
else apps.push({name,target:args[2],color:DEFAULT_COLORS.app});
saveApps();
renderApps(index>=0?index:apps.length-1);
}else if(cmd=="rm"&&args.length==2){
const index=findIndex(args[1]);
if(!apps[index])return say("Không tìm thấy: "+args[1]);
const item=list.children[index];
apps.splice(index,1);
saveApps();
play(item,"leave");
setTimeout(()=>renderApps(-1),320);
}else if(cmd=="mv"&&args.length==3&&/^\d+$/.test(args[2])){
const from=findIndex(args[1]);
if(!apps[from])return say("Không tìm thấy: "+args[1]);
const to=Math.min(Math.max(+args[2]-1,0),apps.length-1);
apps.splice(to,0,apps.splice(from,1)[0]);
saveApps();
renderApps(to);
}else if(cmd=="color"){
runColor(args);
}else if(v=="wallpaper --set"){
f.click();
}else if(v=="wallpaper --remove"){
removeWallpaper();
}else if(/^wallpaper --blur \d{1,2}$/.test(v)){
blur=Math.min(40,+args[2]);
save("b",blur);
renderWallpaper();
play(bg,"bgin");
}else if(/^wallpaper --dim \d{1,3}$/.test(v)){
dim=Math.min(100,+args[2])/100;
save("d",dim);
renderWallpaper();
play(bg,"bgin");
}else{
const index=findIndex(v);
if(apps[index]){
launch(apps[index].target,list.children[index]);
} else if (window.AndroidBridge && window.AndroidBridge.openByName) {
window.AndroidBridge.openByName(v);
} else {
launch(v,row);
}
}
};
q.oninput=()=>play(arrow,"pulse");
q.onchange=()=>{
const v=q.value.trim();
q.value="";
say("");
play(row,"pulse");
if(v)run(v);
};
["gesturestart","gesturechange","dblclick"].forEach(name=>document.addEventListener(name,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("portrait").catch(()=>{});
renderWallpaper();
renderApps();
play(promptLine,"enter");
play(row,"enter",120);
if(wallpaper)play(bg,"bgin");
</script>
